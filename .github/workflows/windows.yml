name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Portable pack, persistence, and transaction tests
        run: dotnet run --project Windows/CuteCursor.Tests -c Release
      - name: Build native Windows app
        run: dotnet build Windows/CuteCursor.Windows -c Release
      - name: Native image and cursor creation tests (no system replacement)
        shell: pwsh
        run: |
          $env:CUTE_CURSOR_SMOKE_RESULT = "$env:RUNNER_TEMP/smoke.json"
          dotnet Windows/CuteCursor.Windows/bin/Release/net10.0-windows/CuteCursor.dll --self-test
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $env:CUTE_CURSOR_SMOKE_RESULT)) {
            if (Test-Path "$env:TEMP/CuteCursor-test-error.txt") { Get-Content "$env:TEMP/CuteCursor-test-error.txt" }
            throw "Native smoke tests failed."
          }
          Get-Content $env:CUTE_CURSOR_SMOKE_RESULT
      - name: Render Windows interface in an isolated library
        shell: pwsh
        run: |
          dotnet Windows/CuteCursor.Windows/bin/Release/net10.0-windows/CuteCursor.dll --screenshot "$env:RUNNER_TEMP/windows-soft-bloom.png"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$env:RUNNER_TEMP/windows-soft-bloom.png")) {
            if (Test-Path "$env:TEMP/CuteCursor-test-error.txt") { Get-Content "$env:TEMP/CuteCursor-test-error.txt" }
            throw "Windows UI render failed."
          }
      - name: Build self-contained x64 development package (no upload)
        run: ./scripts/build-windows.ps1 -Runtime win-x64
      - name: Build self-contained ARM64 development package (no upload)
        run: ./scripts/build-windows.ps1 -Runtime win-arm64
      - name: Save UI review image only
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-preview
          path: ${{ runner.temp }}/windows-soft-bloom.png
          retention-days: 7
